name: bsunits-beloan-unified-local
services:
  db:
    image: mariadb:10.11
    restart: unless-stopped
    ports:
      - "127.0.0.1:3309:3306"
    environment:
      MARIADB_ROOT_PASSWORD: local-only-unified
      MARIADB_DATABASE: bsunits_beloan_final
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --event-scheduler=OFF
      - --max-allowed-packet=64M
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - final-data:/var/lib/mysql
volumes:
  final-data:
