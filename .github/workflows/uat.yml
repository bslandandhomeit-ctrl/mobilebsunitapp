name: UAT

# Checks every push to the uat branch: static analysis and the widget tests.
# Release builds are made with tools/release/build-release.sh (needs the signing key).
on:
  push:
    branches: [uat]
  pull_request:
    branches: [uat]
  workflow_dispatch:

jobs:
  flutter-checks:
    name: Flutter analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true

      - run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      - name: Summary
        if: github.event_name == 'push'
        run: echo "### Analyze and tests passed for \`${GITHUB_SHA::8}\`" >> "$GITHUB_STEP_SUMMARY"
